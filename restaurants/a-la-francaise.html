<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://kit.fontawesome.com/832f4499dc.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="../style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap" rel="stylesheet">
        <title>A la Francaise</title>
    </head>
    <body>
        <div class="main-container">
            <header class="header__meal">
                <a href="../index.html"><i class="fa-solid fa-arrow-left"></i></a>
                <div class="header__meal--title">
                    <h1>Ohmyfood</h1>
                </div>
                <div class="header__meal--logo">
                    <img src="../asset/images/logo/ohmyfood.png" alt="Logo de l'entreprise">
                </div>
            </header>
            <main>
                <div class="meal">
                    <img src="../asset/images/restaurants/toa-heftiba-DQKerTsQwi0-unsplash.jpg" alt="Image montrant s assiette avec de la salade et mozarella">
                    <div class="meal__section">
                        <div class="meal__section--title">
                                <h2>A la Francaise</h2>
                                <label class="meal__section--heart">
                                    <input type="checkbox" class="heart-toggle" hidden />
                                    <i class="fa-regular fa-heart"></i>
                                    <i class="fa-solid fa-heart fa-full"></i>
                                </label>
                            </div>

                        <section>
                            <div class="meal__card">
                                <div class="meal__card--animation1">
                                    <div class="meal__card--text">
                                        <h2>ENTRÉES</h2>
                                    </div>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <div class="meal__card--content-description">
                                            <h3>Tartare de poulpe acidulé</h3>
                                            <p>Aux zestes d'orange</p>
                                        </div>
                                        <div class="meal__card--content-price">
                                            <p>25 €</p>
                                        </div>
                                        <div class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </div>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <div class="meal__card--content-description">
                                            <h3>Velouté de légumes d'antan</h3>
                                            <p>Carotte, panais, topinambour</p>
                                        </div>
                                        <div class="meal__card--content-price">
                                            <p>35 €</p>
                                        </div>
                                        <div class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </div>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <div class="meal__card--content-description">
                                            <h3>Soupe à l'oignon</h3>
                                            <p>Revisitée</p>
                                        </div>
                                        <div class="meal__card--content-price">
                                            <p>20 €</p>
                                        </div>
                                        <div class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </section>

                        <section>
                            <div class="meal__card">
                                <div class="meal__card--animation2">
                                    <div class="meal__card--text">
                                        <h2>PLATS</h2>
                                    </div>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <div class="meal__card--content-description">
                                            <h3>Coquilles Saint-Jacques</h3>
                                            <p>Accompagnées d'une purée de panais</p>
                                        </div>
                                        <div class="meal__card--content-price">
                                            <p>40 €</p>
                                        </div>
                                        <div class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </div>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <div class="meal__card--content-description">
                                            <h3>Magret de canard</h3>
                                            <p>Et parmentier de pommes de terre</p>
                                        </div>
                                        <div class="meal__card--content-price">
                                            <p>35 €</p>
                                        </div>
                                        <div class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </div>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <div class="meal__card--content-description">
                                            <h3>Pigeonneau d’Ille-et-Vilaine</h3>
                                            <p>Sur son lit de gnocchis aux légumes</p>
                                        </div>
                                        <div class="meal__card--content-price">
                                            <p>44 €</p>
                                        </div>
                                        <div class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </section>
                        <section>
                            <div class="meal__card">
                                <div class="meal__card--animation3">
                                    <div class="meal__card--text">
                                        <h2>DESSERTS</h2>
                                    </div>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <div class="meal__card--content-description">
                                            <h3>Pétales de violettes glacés</h3>
                                            <p>Et purée de noisettes</p>
                                        </div>
                                        <div class="meal__card--content-price">
                                            <p>18 €</p>
                                        </div>
                                        <div class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </div>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <div class="meal__card--content-description">
                                            <h3>Fondant au chocolat</h3>
                                            <p>Revisité</p>
                                        </div>
                                        <div class="meal__card--content-price">
                                            <p>22 €</p>
                                        </div>
                                        <div class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </div>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <div class="meal__card--content-description">
                                            <h3>Millefeuille croustillant</h3>
                                            <p>Myrtilles et pâte d’amande</p>
                                        </div>
                                        <div class="meal__card--content-price">
                                            <p>23 €</p>
                                        </div>
                                        <div class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </section>
                        <div class="order">
                            <button>Commander</button>
                        </div>
                    </div> 
                </div> 


                <footer>
                    <div class="footer">
                        <div class="footer__logo">
                            <img src="../asset/images/logo/ohmyfood@2x.svg" alt=""> 
                        </div>
                        <div class="footer__list">
                            <ul class="footer__list--content">
                                <li class="footer__list--content-li"><i class="fa-solid fa-utensils"></i>Proposer un restaurant</li>
                            </ul>
                            <ul class="footer__list--content">
                                <li class="footer__list--content-li"><i class="fa-solid fa-hands-helping"></i>Devenir Partenaire</li>
                            </ul>
                            <ul class="footer__list--content">
                                <li class="footer__list--content-li">Mentions légales</li>
                            </ul>
                            <ul class="footer__list--content">
                                <li class="footer__list--content-li">Contact</li>
                            </ul>
                        </div>
                    </div>
                </footer>
            </main>
        </div> <!-- .main-container -->
    </body>
</html>
