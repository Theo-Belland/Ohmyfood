<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://kit.fontawesome.com/832f4499dc.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="../style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap" rel="stylesheet">
        <title>Document</title>
    </head>
    <body>
        <div class="main-container">
            <header class="header__meal">
                <a href="../index.html"><i class="fa-solid fa-arrow-left"></i></a>
                <img src="../asset/images/logo/ohmyfood@2x.svg" alt="">
            </header>
            <main>
                <div class="meal">
                    <img src="../asset/images/restaurants/jay-wennington-N_Y88TWmGwA-unsplash.jpg" alt="">
                    <div class="meal__section">
                        <div class="meal__section--title">
                                <h2>La Note Enchantée</h2>
                                <label class="meal__section--heart">
                                    <input type="checkbox" class="heart-toggle" hidden />
                                    <i class="fa-regular fa-heart"></i>
                                    <i class="fa-solid fa-heart fa-full"></i>
                                </label>
                            </div>

                        <section>
                            <div class="meal__card">
                                <div class="meal__card--animation1">
                                    <div class="meal__card--text">
                                        <h2>Entrées</h2>
                                    </div>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Ravioles de foie gras</h3>
                                            <p>Accompagnées de leur crème à la truffe</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>25 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Caviar osciètre</h3>
                                            <p>Sur blini à la farine de blé noir</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>35 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Homard et espuma de potiron</h3>
                                            <p>Marinés aux zestes d'orange</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>20 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Foie gras de canard cuit entier</h3>
                                            <p>Confiture de figue et pain toasté</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>35 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </section>

                        <section>
                            <div class="meal__card">
                                <div class="meal__card--animation2">
                                    <div class="meal__card--text">
                                        <h2>PLATS</h2>
                                    </div>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Noix de coquilles Saint-Jacques</h3>
                                            <p>Sur lit de purée de céleri-rave</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>40 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Langoustine poêlée</h3>
                                            <p>Purée de patate douce</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>35 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Mijoté de queue de bœuf</h3>
                                            <p>Et riz sauvage aux zestes de citron</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>44 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </section>
                        <section>
                            <div class="meal__card">
                                <div class="meal__card--animation3">
                                    <div class="meal__card--text">
                                        <h2>DESSERTS</h2>
                                    </div>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Macaron noisette et chocolat</h3>
                                            <p>Glace au caramel brun et sel de Guérande</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>18 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Baba au rhum revisité</h3>
                                            <p>Avec son coulis de citron</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>22 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Tarte au citron meringuée</h3>
                                            <p>Déstructurée</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>23 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </section>
                        <div class="order">
                            <button>Commander</button>
                        </div>
                    </div> 
                </div> 


                <footer>
                    <div class="footer">
                        <div class="footer__logo">
                            <img src="../asset/images/logo/ohmyfood@2x.svg" alt=""> 
                        </div>
                        <div class="footer__list">
                            <ul class="footer__list--content">
                                <li class="footer__list--content-li"><i class="fa-solid fa-utensils"></i>Proposer un restaurant</li>
                            </ul>
                            <ul class="footer__list--content">
                                <li class="footer__list--content-li"><i class="fa-solid fa-hands-helping"></i>Devenir Partenaire</li>
                            </ul>
                            <ul class="footer__list--content">
                                <li class="footer__list--content-li">Mentions légales</li>
                            </ul>
                            <ul class="footer__list--content">
                                <li class="footer__list--content-li">Contact</li>
                            </ul>
                        </div>
                    </div>
                </footer>
            </main>
        </div> <!-- .main-container -->
    </body>
</html>
