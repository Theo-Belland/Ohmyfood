<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://kit.fontawesome.com/832f4499dc.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="../style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Shrikhand&display=swap" rel="stylesheet">
        <title>Le Délice Des Sens</title>
    </head>
    <body>
        <div class="main-container">
            <header class="header__meal">
                <a href="../index.html"><i class="fa-solid fa-arrow-left"></i></a>
                <div class="header__meal--title">
                    <h1>Ohmyfood</h1>
                </div>
                <div class="header__meal--logo">
                    <img src="../asset/images/logo/ohmyfood.png" alt="">
                </div>
            </header>
            <main>
                <div class="meal">
                    <img src="../asset/images/restaurants/jay-wennington-N_Y88TWmGwA-unsplash.jpg" alt="">
                    <div class="meal__section">
                        <div class="meal__section--title">
                                <h2>Le Délice Des Sens</h2>
                                <label class="meal__section--heart">
                                    <input type="checkbox" class="heart-toggle" hidden />
                                    <i class="fa-regular fa-heart"></i>
                                    <i class="fa-solid fa-heart fa-full"></i>
                                </label>
                            </div>

                        <section>
                            <div class="meal__card">
                                <div class="meal__card--animation1">
                                    <div class="meal__card--text">
                                        <h2>Entrées</h2>
                                    </div>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Tartare de thon</h3>
                                            <p>Assaisonné au yuzu</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>25 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Bouchée de homard croustillant </h3>
                                            <p>Et sa farandole de petits légumes</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>35 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Velouté de cèpes </h3>
                                            <p>Aux truffes</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>20 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </section>

                        <section>
                            <div class="meal__card">
                                <div class="meal__card--animation2">
                                    <div class="meal__card--text">
                                        <h2>PLATS</h2>
                                    </div>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Poulet rôti aux herbes de Provence</h3>
                                            <p>Et sa crème de truffe</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>40 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Langouste rôtie</h3>
                                            <p>Et ses légumes de saison</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>35 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Côte de bœuf Angus</h3>
                                            <p>Et sa purée de panais</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>44 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </section>
                        <section>
                            <div class="meal__card">
                                <div class="meal__card--animation3">
                                    <div class="meal__card--text">
                                        <h2>DESSERTS</h2>
                                    </div>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Farandole de desserts</h3>
                                            <p>Du chef</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>18 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Crème brulée</h3>
                                            <p>Revisitée</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>22 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                    <label class="meal__card--content">
                                        <input type="checkbox" class="check" />
                                        <span class="meal__card--content-description">
                                            <h3>Tiramisu</h3>
                                            <p>À la noisette</p>
                                        </span>
                                        <span class="meal__card--content-price">
                                            <p>23 €</p>
                                        </span>
                                        <span class="meal__card--content-check">
                                            <i class="fa-solid fa-circle-check"></i>
                                        </span>
                                    </label>
                                </div>
                            </div>
                        </section>
                        <div class="order">
                            <button>Commander</button>
                        </div>
                    </div> 
                </div> 


                <footer>
                    <div class="footer">
                        <div class="footer__logo">
                            <img src="../asset/images/logo/ohmyfood@2x.svg" alt=""> 
                        </div>
                        <div class="footer__list">
                            <ul class="footer__list--content">
                                <li class="footer__list--content-li"><i class="fa-solid fa-utensils"></i>Proposer un restaurant</li>
                            </ul>
                            <ul class="footer__list--content">
                                <li class="footer__list--content-li"><i class="fa-solid fa-hands-helping"></i>Devenir Partenaire</li>
                            </ul>
                            <ul class="footer__list--content">
                                <li class="footer__list--content-li">Mentions légales</li>
                            </ul>
                            <ul class="footer__list--content">
                                <li class="footer__list--content-li">Contact</li>
                            </ul>
                        </div>
                    </div>
                </footer>
            </main>
        </div> <!-- .main-container -->
    </body>
</html>
