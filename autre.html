<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Carte</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    .meal__card--wrapper {
      position: relative;
      margin: 50px;
    }

    input.check {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      height: 0;
      width: 0;
      margin: 0;
      z-index: -1;
    }

    .meal__card--content {
      background-color: #fff;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 10px;
      box-shadow: 1px 1px 1px grey;
      margin-top: 10px;
      width: 340px;
      padding: 0;
      overflow: hidden;
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .meal__card--content-description {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 15px;
      flex: 1;
      overflow: hidden;
    }

    .meal__card--content-description h3,
    .meal__card--content-description p {
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meal__card--content-price {
      display: flex;
      padding: 15px;
      margin-right: -50px;
      transition: margin-right 0.4s ease;
    }

    .meal__card--content-price p {
      margin: 0;
      font-weight: bold;
    }

    .meal__card--content-check {
      background-color: #99cc99;
      height: 75px;
      width: 60px;
      border-radius: 0 20px 20px 0;
      justify-content: center;
      align-items: center;
      display: flex;
      opacity: 0;
      transform: translateX(100%);
      transition: transform 0.4s ease, opacity 0.4s ease, margin-right 0.4s ease;
      margin-right: 0;
    }

    .meal__card--content-check i {
      font-size: 20px;
      color: white;
    }

    input.check:checked + label .meal__card--content-check {
      opacity: 1;
      transform: translateX(0);
      margin-right: -1px;
    }

    input.check:checked + label .meal__card--content-price {
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <div class="meal__card--wrapper">
    <input type="checkbox" id="meal1" class="check" />
    <label for="meal1" class="meal__card--content">
      <div class="meal__card--content-description">
        <h3>Fricassée d'escargots</h3>
        <p>Au piment d'Espelette</p>
      </div>
      <div class="meal__card--content-price">
        <p>25 €</p>
      </div>
      <div class="meal__card--content-check">
        <i class="fa-solid fa-circle-check"></i>
      </div>
    </label>
  </div>

</body>
</html>
